<div class="min-h-screen flex flex-col text-gray-100 relative z-10">
  <!-- Ultra Professional Vertical Navbar -->
  <nav class="fixed left-8 top-1/2 -translate-y-1/2 z-50 hidden lg:block">
    <div class="relative flex flex-col items-center gap-6 p-4 glass-panel rounded-[2.5rem] shadow-2xl shadow-black/60 group/nav border border-white/5 backdrop-blur-3xl">
      <!-- Decorative HUD Lines -->
      <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-[2px] h-8 bg-gradient-to-t from-brand-primary/40 to-transparent"></div>
      <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-[2px] h-8 bg-gradient-to-b from-brand-primary/40 to-transparent"></div>

      <!-- Branding Logo -->
      <a routerLink="/" class="relative w-14 h-14 flex items-center justify-center mb-4 group/logo">
        <div class="absolute inset-0 rounded-2xl bg-brand-primary/10 scale-0 group-hover/logo:scale-100 transition-transform duration-500"></div>
        <span class="relative z-10 text-2xl font-black text-brand-primary select-none font-mono tracking-tighter">A<span class="text-white">_</span></span>
        <!-- Orbiting ring -->
        <div class="absolute inset-0 border border-brand-primary/20 rounded-2xl rotate-45 group-hover/logo:rotate-180 transition-transform duration-1000"></div>
      </a>

      <!-- Navigation Links -->
      <div class="flex flex-col gap-4">
        <!-- Home -->
        <a routerLink="/" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}" 
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-500 hover:text-white transition-all duration-500 group/item">
          <div class="absolute inset-0 rounded-2xl bg-white/[0.03] opacity-0 group-hover/item:opacity-100 transition-opacity"></div>
          <svg class="relative z-10 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001-1m-6 0h6"/></svg>
          <span class="absolute left-16 px-4 py-2 bg-[#0a0a0a] border border-white/10 text-white text-[9px] font-black uppercase tracking-[0.3em] rounded-xl opacity-0 -translate-x-4 pointer-events-none group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all duration-500 shadow-2xl whitespace-nowrap z-[60]">
            <span class="text-brand-primary mr-2">01</span> Home
          </span>
          <div class="nav-indicator"></div>
        </a>

        <!-- About -->
        <a routerLink="/about" routerLinkActive="active-nav"
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-500 hover:text-white transition-all duration-500 group/item">
          <div class="absolute inset-0 rounded-2xl bg-white/[0.03] opacity-0 group-hover/item:opacity-100 transition-opacity"></div>
          <svg class="relative z-10 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="absolute left-16 px-4 py-2 bg-[#0a0a0a] border border-white/10 text-white text-[9px] font-black uppercase tracking-[0.3em] rounded-xl opacity-0 -translate-x-4 pointer-events-none group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all duration-500 shadow-2xl whitespace-nowrap z-[60]">
            <span class="text-brand-primary mr-2">02</span> Bio_Data
          </span>
          <div class="nav-indicator"></div>
        </a>

        <!-- Resume -->
        <a routerLink="/resume" routerLinkActive="active-nav"
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-500 hover:text-white transition-all duration-500 group/item">
          <div class="absolute inset-0 rounded-2xl bg-white/[0.03] opacity-0 group-hover/item:opacity-100 transition-opacity"></div>
          <svg class="relative z-10 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span class="absolute left-16 px-4 py-2 bg-[#0a0a0a] border border-white/10 text-white text-[9px] font-black uppercase tracking-[0.3em] rounded-xl opacity-0 -translate-x-4 pointer-events-none group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all duration-500 shadow-2xl whitespace-nowrap z-[60]">
            <span class="text-brand-primary mr-2">03</span> Career_Log
          </span>
          <div class="nav-indicator"></div>
        </a>

        <!-- Portfolio -->
        <a routerLink="/portfolio" routerLinkActive="active-nav"
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-500 hover:text-white transition-all duration-500 group/item">
          <div class="absolute inset-0 rounded-2xl bg-white/[0.03] opacity-0 group-hover/item:opacity-100 transition-opacity"></div>
          <svg class="relative z-10 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span class="absolute left-16 px-4 py-2 bg-[#0a0a0a] border border-white/10 text-white text-[9px] font-black uppercase tracking-[0.3em] rounded-xl opacity-0 -translate-x-4 pointer-events-none group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all duration-500 shadow-2xl whitespace-nowrap z-[60]">
            <span class="text-brand-primary mr-2">04</span> Artifacts
          </span>
          <div class="nav-indicator"></div>
        </a>

        <!-- Contact -->
        <a routerLink="/contact" routerLinkActive="active-nav"
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-500 hover:text-white transition-all duration-500 group/item">
          <div class="absolute inset-0 rounded-2xl bg-white/[0.03] opacity-0 group-hover/item:opacity-100 transition-opacity"></div>
          <svg class="relative z-10 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span class="absolute left-16 px-4 py-2 bg-[#0a0a0a] border border-white/10 text-white text-[9px] font-black uppercase tracking-[0.3em] rounded-xl opacity-0 -translate-x-4 pointer-events-none group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all duration-500 shadow-2xl whitespace-nowrap z-[60]">
            <span class="text-brand-primary mr-2">05</span> Uplink
          </span>
          <div class="nav-indicator"></div>
        </a>
      </div>
    </div>
  </nav>

  <!-- Mobile Bottom Navbar -->
  <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 lg:hidden w-[90%] max-w-md mobile-navbar">
    <div class="flex items-center justify-around p-3 glass-panel rounded-2xl shadow-2xl backdrop-blur-3xl border border-white/5">
      <a routerLink="/" routerLinkActive="!text-brand-primary bg-brand-primary/10 shadow-[0_0_20px_rgba(16,185,129,0.2)]" [routerLinkActiveOptions]="{exact: true}" 
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-500 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001-1m-6 0h6"/></svg>
      </a>
      <a routerLink="/about" routerLinkActive="!text-brand-primary bg-brand-primary/10 shadow-[0_0_20px_rgba(16,185,129,0.2)]"
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-500 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      </a>
      <a routerLink="/resume" routerLinkActive="!text-brand-primary bg-brand-primary/10 shadow-[0_0_20px_rgba(16,185,129,0.2)]"
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-500 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </a>
      <a routerLink="/portfolio" routerLinkActive="!text-brand-primary bg-brand-primary/10 shadow-[0_0_20px_rgba(16,185,129,0.2)]"
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-500 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </a>
      <a routerLink="/contact" routerLinkActive="!text-brand-primary bg-brand-primary/10 shadow-[0_0_20px_rgba(16,185,129,0.2)]"
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-500 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </a>
    </div>
  </nav>

  <!-- Dynamic Content -->
  <main class="flex-grow lg:pl-24 pb-32 lg:pb-0">
    <router-outlet></router-outlet>
  </main>
</div>
