<div class="min-h-screen flex flex-col text-gray-100 relative z-10">
  <!-- Ultra Professional Vertical Navbar -->
  <nav class="fixed left-8 top-1/2 -translate-y-1/2 z-50 hidden lg:block">
    <div class="flex flex-col items-center gap-4 p-3 bg-[#0B1615]/40 backdrop-blur-2xl border border-white/10 rounded-[2rem] shadow-2xl shadow-black/50 group/nav">
      <!-- Branding Logo -->
      <a routerLink="/" class="w-12 h-12 flex items-center justify-center mb-2">
        <span class="text-2xl font-black text-brand-primary select-none">A<span class="text-white">.</span></span>
      </a>

      <!-- Navigation Links with Tooltips -->
      <div class="flex flex-col gap-3">
        <!-- Home -->
        <a routerLink="/" routerLinkActive="bg-brand-primary !text-brand-bg shadow-lg shadow-brand-primary/20 scale-110" [routerLinkActiveOptions]="{exact: true}" 
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-all duration-300 group/item">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001-1m-6 0h6"/></svg>
          <span class="absolute left-16 px-3 py-1.5 bg-white text-gray-900 text-[11px] font-bold uppercase tracking-widest rounded-lg opacity-0 -translate-x-4 pointer-events-none group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all duration-300 whitespace-nowrap shadow-xl">Home</span>
        </a>

        <!-- About -->
        <a routerLink="/about" routerLinkActive="bg-brand-primary !text-brand-bg shadow-lg shadow-brand-primary/20 scale-110"
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-all duration-300 group/item">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>

        </a>

        <!-- Resume -->
        <a routerLink="/resume" routerLinkActive="bg-brand-primary !text-brand-bg shadow-lg shadow-brand-primary/20 scale-110"
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-all duration-300 group/item">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

        </a>

        <!-- Portfolio -->
        <a routerLink="/portfolio" routerLinkActive="bg-brand-primary !text-brand-bg shadow-lg shadow-brand-primary/20 scale-110"
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-all duration-300 group/item">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span class="absolute left-16 px-3 py-1.5 bg-white text-gray-900 text-[11px] font-bold uppercase tracking-widest rounded-lg opacity-0 -translate-x-4 pointer-events-none group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all duration-300 whitespace-nowrap shadow-xl">Portfolio</span>
        </a>

        <!-- Contact -->
        <a routerLink="/contact" routerLinkActive="bg-brand-primary !text-brand-bg shadow-lg shadow-brand-primary/20 scale-110"
           class="relative w-12 h-12 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-all duration-300 group/item">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span class="absolute left-16 px-3 py-1.5 bg-white text-gray-900 text-[11px] font-bold uppercase tracking-widest rounded-lg opacity-0 -translate-x-4 pointer-events-none group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all duration-300 whitespace-nowrap shadow-xl">Contact</span>
        </a>
      </div>

  </nav>

    <div class="flex items-center justify-around p-2 bg-[#0B1615]/60 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-2xl">
      <a routerLink="/" routerLinkActive="bg-brand-primary !text-brand-bg" [routerLinkActiveOptions]="{exact: true}" 
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-400 transition-all">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001-1m-6 0h6"/></svg>
      </a>
      <a routerLink="/about" routerLinkActive="bg-brand-primary !text-brand-bg"

        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      </a>
      <a routerLink="/resume" routerLinkActive="bg-brand-primary !text-brand-bg"
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-400 transition-all">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </a>
      <a routerLink="/portfolio" routerLinkActive="bg-brand-primary !text-brand-bg"
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-400 transition-all">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </a>
      <a routerLink="/contact" routerLinkActive="bg-brand-primary !text-brand-bg"
         class="w-12 h-12 rounded-xl flex items-center justify-center text-gray-400 transition-all">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </a>
    </div>
  </nav>

  <!-- Dynamic Content -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>
</div>
