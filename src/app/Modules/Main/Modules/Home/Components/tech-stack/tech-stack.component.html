<section class="py-24 relative overflow-hidden bg-gray-50/50 dark:bg-gray-950/50">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">
    <div class="mb-16">
      <h2 class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600 mb-4">Core Stack</h2>
      <p class="text-3xl font-bold text-gray-900 dark:text-white">Professional Toolset</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div *ngFor="let tech of techStack"
           class="group p-8 bg-white dark:bg-gray-900 rounded-3xl border border-gray-100 dark:border-white/5 hover:border-blue-500/30 transition-all duration-500">
        <div class="w-12 h-12 rounded-xl bg-gray-50 dark:bg-white/5 flex items-center justify-center text-2xl mb-6 group-hover:scale-110 group-hover:bg-blue-50 dark:group-hover:bg-blue-500/10 transition-all duration-500">
          {{ tech.icon }}
        </div>
        <div class="space-y-1">
          <h4 class="text-lg font-bold text-gray-900 dark:text-white">{{ tech.name }}</h4>
          <p class="text-[13px] text-gray-500 font-medium leading-relaxed">
            Building complex, high-performance web applications.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
