<section class="relative min-h-screen flex items-center justify-center overflow-hidden bg-transparent pt-20">
  <!-- Subtle Grid Background Overlay -->
  <div class="absolute inset-0 z-0 opacity-[0.15]"
       style="background-image: radial-gradient(#10b981 1px, transparent 1px); background-size: 40px 40px;"></div>

  <!-- Content Container -->
  <div class="relative z-10 max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

    <!-- Left Side: Text Content -->
    <div class="space-y-8">
      <div
        class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-brand-primary/30 bg-brand-primary/5 text-brand-primary text-sm font-medium">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-primary opacity-75"></span>
          <span
            class="relative inline-flex rounded-full h-2 w-2 bg-brand-primary shadow-[0_0_10px_rgba(16,185,129,0.8)]"></span>
        </span>
        Available for new AI-driven projects
      </div>

      <div class="space-y-4">
        <h2 class="text-gray-400 font-mono text-lg tracking-widest uppercase">System.Initialize();</h2>
        <h1 class="text-4xl sm:text-5xl md:text-7xl font-bold tracking-tight text-white leading-tight">
          {{ splitName.first }} <span *ngIf="splitName.rest" class="text-gradient">{{ splitName.rest }}</span>
        </h1>
        <div class="h-12 flex items-center">
          <p class="text-2xl md:text-3xl text-gray-400 font-mono">
            > <span #typedElement class="text-white"></span>
          </p>
        </div>
      </div>

      <p class="text-lg text-gray-400 max-w-xl leading-relaxed">
        {{ header.data.brief }}
      </p>

      <!-- Social & CTA -->
      <div class="flex flex-wrap items-center gap-6 pt-4">
        <a [href]="header.data.cvPath" target="_blank"
           class="group relative px-8 py-4 bg-brand-primary text-black font-bold rounded-lg overflow-hidden transition-all hover:scale-105 active:scale-95">
          <div
            class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
          <span class="relative flex items-center gap-2">
            DOWNLOAD CV
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round"
                                                                                             stroke-linejoin="round"
                                                                                             stroke-width="2"
                                                                                             d="M12 4v16m8-8H4"/></svg>
          </span>
        </a>

        <div class="flex items-center gap-4 text-gray-400">
          @for (social of header.data.socialLinks; track social) {
            <a [href]="social.link" target="_blank" class="hover:text-white transition-all">
              <i [class]="social.fontAwesomeIcon + ' fa-2x'"></i>
            </a>
          }
        </div>
      </div>
    </div>

    <!-- Right Side: Visual Element (Tech Orbit/Avatar) -->
    <div class="flex justify-center items-center relative lg:order-last order-first mb-12 lg:mb-0">
      <div class="relative w-64 h-64 md:w-80 md:h-80">
        <!-- Rotating Outer Rings & Floating Labels -->
        <div class="absolute inset-0 border-2 border-brand-primary/20 rounded-full animate-spin-slow">
          <!-- Orbiting Label 1 -->
          <div class="absolute -top-4 -right-4 animate-spin-slow-reverse">
            <div
              class="glass-card px-4 py-2 rounded-lg text-xs font-mono text-brand-primary border border-brand-primary/30">
              AI_READY: TRUE
            </div>
          </div>
          <!-- Orbiting Label 2 -->
          <div class="absolute -bottom-4 -left-4 animate-spin-slow-reverse">
            <div
              class="glass-card px-4 py-2 rounded-lg text-xs font-mono text-brand-primary border border-brand-primary/30">
              FRONTEND: ACTIVE
            </div>
          </div>
        </div>

        <div class="absolute inset-5 border-2 border-brand-accent/20 rounded-full animate-spin-slow-reverse">
          <!-- Orbiting Label 3 -->
          <div class="absolute -top-4 -left-4 animate-spin-slow">
            <div
              class="glass-card px-4 py-2 rounded-lg text-xs font-mono text-brand-accent border border-brand-accent/30">
              MOBILE_DEV: TRUE
            </div>
          </div>
          <!-- Orbiting Label 4 -->
          <div class="absolute -bottom-4 -right-4 animate-spin-slow">
            <div
              class="glass-card px-4 py-2 rounded-lg text-xs font-mono text-brand-accent border border-brand-accent/30">
              BACKEND: ACTIVE
            </div>
          </div>
        </div>

        <div class="absolute inset-10 border border-white/10 rounded-full animate-spin-very-slow">
          <!-- Orbiting Label 5 - Fixed the translate glitch by using a wrapper -->
          <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 animate-spin-very-slow-reverse">
            <div
              class="glass-card px-3 py-1 rounded-lg text-[10px] font-mono text-gray-400 border border-white/10 whitespace-nowrap">
              LOCATION: SAUDI ARABIA
            </div>
          </div>
        </div>

        <!-- Center Image with Glow -->
        <div
          class="absolute inset-12 md:inset-16 rounded-full overflow-hidden border-4 border-brand-primary/50 shadow-[0_0_50px_rgba(16,185,129,0.3)]">
          <img [src]="header.data.profileImage" [alt]="header.data.name + ' Profile Image'"
               class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700 scale-110 hover:scale-100">
        </div>
      </div>
    </div>
  </div>
</section>
