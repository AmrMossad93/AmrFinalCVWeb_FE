server {
    listen 80;
    listen [::]:80;

    server_name amr-mossad.massar-tech.io;

    root /var/www/amr-mossad;
    index index.html;

    # Angular SPA: send unknown paths to index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so deploys show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets (Angular adds content hashes) — cache aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# NOTE: After running `certbot --nginx -d amr-mossad.massar-tech.io`,
# Certbot automatically adds a `listen 443 ssl` block and an HTTP->HTTPS
# redirect here. You don't need to edit SSL settings by hand.
